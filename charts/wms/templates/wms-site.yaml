apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-wms-plant
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wms.labels" . | nindent 4 }}
    app: wms-site
data:
  plant.json: |
    {{ .Values.catalog | toJson }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wms-site
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wms.labels" . | nindent 4 }}
    app: wms-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wms-site
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "wms.labels" . | nindent 8 }}
        app: wms-site
    spec:
      {{- with .Values.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: wms-site
          image: {{ required "image is required" .Values.image | quote }}
          {{- with .Values.command }}
          command: {{ toJson . }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: WMS_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret }}
                  key: url
            - name: WMS_PLANT_PATH
              value: /etc/wms/plant.json
          volumeMounts:
            - name: plant
              mountPath: /etc/wms
              readOnly: true
          readinessProbe:
            httpGet:
              path: /wms/access
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /wms/access
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: plant
          configMap:
            name: {{ .Release.Name }}-wms-plant
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-wms-site
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wms.labels" . | nindent 4 }}
    app: wms-site
spec:
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
  selector:
    app: wms-site
    app.kubernetes.io/instance: {{ .Release.Name }}
